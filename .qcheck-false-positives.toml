# Faux positifs déclarés pour qcheck (voir docs/configuration.md de qcheck).
# Un bloc [[ignore]] = une famille fausse au même endroit, avec sa preuve ;
# une entrée [[false_positive]] = un constat lu et jugé faux, avec sa preuve.
# Revue du 2026-11-26 sur le scan complet de ae7f534.

[[ignore]]
rules = ["cargo-shear:shear/unlinked_files"]
paths = ["crates/tokenade-core/src/cmd/**"]
reason = "relié par un `mod` généré : build.rs parcourt cmd/<os>/ et écrit un `mod` par fichier dans OUT_DIR, inclus par cmd/mod.rs:51 (`include!(concat!(env!(\"OUT_DIR\"), \"/cmd_auto_dispatch.rs\"))`) ; cargo-shear ne lit pas les modules générés"

[[ignore]]
rules = ["gitleaks:*", "aislop:ai-slop/hardcoded-id", "aislop:ai-slop/todo-stub", "aislop:ai-slop/rust-todo-stub", "aislop:ai-slop/generic-naming"]
paths = ["**/*_tests.rs", "**/tests/**", "crates/tokenade-cli/src/tests/**", "**/fixtures/**", "benchmarks/fixtures/**"]
reason = "données de test : faux secrets que le moteur de rédaction (tk-base/src/redact) doit masquer, pages et sorties capturées, sources-fixtures ; aucun n'est une vraie clé ni du code livré"

[[ignore]]
rules = ["architecture:same-name-function", "architecture:scattered-literal", "similarity:similar-function", "jscpd:clone"]
paths = ["crates/tokenade-cli/assets/**"]
reason = "chaque passerelle (cline, opencode, openclaw, pi, hermes) est UN fichier autonome copié dans le dossier de plugins d'un hôte différent : aucun module commun importable ; leur parité est vérifiée par tests/e2e/bridges.rs"

[[ignore]]
rules = ["test-reach:untested-function"]
paths = ["crates/tokenade-cli/assets/**", "crates/tokenade-core/src/js/**"]
reason = "exécutés par les tests Rust à travers node, python ou QuickJS (tests/e2e/bridges.rs lance chaque passerelle, js_render.rs exécute driver/harvest/shim) : l'atteinte statique ne traverse pas le changement de langage"

[[ignore]]
rules = ["ruff:BLE001", "ruff:S112", "aislop:ai-slop/swallowed-exception", "aislop:ai-slop/python-broad-except", "ast-grep:except-return-static-sentinel", "ast-grep:sentinel-fallback-function", "ast-grep:len-as-condition", "vulture:unused-function"]
paths = ["crates/tokenade-cli/assets/hermes_plugin/**"]
reason = "contrat du plugin d'hôte : une exception qui sort de register() ou d'un hook arrête Hermes ou le tour en cours, donc chaque hook rend None (= garder l'original) ; register() est appelé par Hermes, d'où l'« inutilisé » de vulture"

[[ignore]]
rules = ["slop-scan:*"]
paths = ["npm/**", "crates/tokenade-cli/assets/**", "crates/tokenade-core/src/js/**"]
reason = "replis voulus : l'installeur npm ne doit jamais faire échouer npm (uninstall.js:75 sort toujours 0), une passerelle ne lève jamais dans l'hôte, harvest.js lit des objets de page dont Object.keys peut lever (proxys)"

[[ignore]]
rules = ["dependency-cruiser:*", "deptry:*"]
paths = ["benchmarks/fixtures/**"]
reason = "mini-projets de banc sans dépendances installées : ils servent d'entrée à `tokenade map`/`skeleton`, jamais construits"

[[ignore]]
rules = ["aislop:ai-slop/meta-comment"]
paths = ["**"]
reason = "convention du dépôt : un commentaire garde la cause mesurée et la panne passée (« used to », « MEASURED »), c'est ce qui empêche de réintroduire le défaut ; aucun n'est un commentaire creux"

[[ignore]]
rules = ["eslint:@typescript-eslint/no-explicit-any"]
paths = ["crates/tokenade-cli/assets/**"]
reason = "les hôtes (opencode, cline, pi) ne publient pas de types pour l'objet passé au plugin ; le fichier est chargé tel quel par l'hôte, sans étape de compilation où des types serviraient"

[[ignore]]
rules = ["hadolint:DL3008", "hadolint:DL3016"]
paths = ["docs/demo/Dockerfile"]
reason = "image de démo reconstruite à la main pour enregistrer la vidéo ; politique du projet : pas d'épinglage de versions non demandé"

[[ignore]]
rules = ["cargo-shear:shear/unlinked_files"]
paths = ["crates/tokenade-core/tests/support/**", "crates/tokenade-cli/src/tests/mod.rs"]
reason = "montés par `#[path = \"../support/…\"] mod …;` (tests/fold/main.rs:22, tests/web/main.rs:12, tests/hostile/main.rs:12) et par include!(\"main_tests.rs\") (main.rs:706)"

